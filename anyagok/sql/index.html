<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adatbázisok – Informatika Tanulás</title>
    <link rel="icon" href="../../logos/html_logo.svg">
    <meta name="color-scheme" content="light dark">
    <script>try { var t = localStorage.getItem("ll:theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <style>
        :root { color-scheme: light; --bg: #f3f4f8; --panel: #ffffff; --ink: #151823; --muted: #5d6576; --line: #e1e4ec; --accent: #4f46e5; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0f1117; --panel: #181b24; --ink: #e8eaf2; --muted: #9aa3b5; --line: #2a2f3d; --accent: #8b85ff; } }
        :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1117; --panel: #181b24; --ink: #e8eaf2; --muted: #9aa3b5; --line: #2a2f3d; --accent: #8b85ff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 460px; padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.25; }
        p { margin: 0 0 20px; color: var(--muted); }
        a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Adatbázisok</h1>
        <p>Ez a tananyag még készül. Nézz vissza később!</p>
        <a href="../../">Vissza a főoldalra</a>
    </main>
</body>
</html>
